<!DOCTYPE html>

<html lang="es">
    <head>
        <meta charset="UTF-8"/> 
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Weather-App</title>
        <meta
        name="description"
        content="Encuentra la temperatura de la ciudad a tu elección"
        />
        <meta name="robots" content="index,follow">

        <meta name="theme-color" content="#ffffff">

        <link rel="icon" type="image/jpg" href="./images/icon.png"> <!--Pendiente de hacer-->
        <link rel="stylesheet" href="./style.css">
        <script defer type="module" src="./script.js"></script>
    </head>

    <body>
        <header>
            <h1>Aero-Weather</h1>
        </header>
        <main>
            <header>
                <form role="search" id="form-busqueda">
                    <input name="ciudad" type="text" placeholder="Busca una ciudad">
                </form>
                
                <div class="box-results">
                    <ul id="search-results"></ul>
                </div>
            </header>

            <div class="glass-box">
                <div class="box-content">
                    <h3 id="city-name">San Francisco, CA</h3>
                    <span id="city-temperature">72º<small id="temperature-unit">ºF</small></span>
                    <h3 id="city-weathercode">Nublado</h3>
                    <small id="city-precipitation">2% Precipitación</small>
                    
                </div>
                <div class="icon-container">
                    <weather-icon data-value="rainy"></weather-icon>
                </div>
                
            </div>
        </main>
    </body>
</html>
