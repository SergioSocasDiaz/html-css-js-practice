<!DOCTYPE html>

<html lang="es">
    <head>
        <meta charset="UTF-8"/> 
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Weather-App</title>
        <meta
        name="description"
        content="Encuentra la temperatura de la ciudad a tu elección"
        />
        <meta name="robots" content="index,follow">

        <meta name="theme-color" content="#ffffff">

        <link rel="icon" type="image/jpg" href="./images/icon.png"> <!--Pendiente de hacer-->
        <link rel="stylesheet" href="./style.css">
        <script type="module" src="./script.js"></script>
    </head>

    <body>
        <header>
            <h1>Aero-Weather</h1>
        </header>
        <main>
            <header>
                <input placeholder="Busca una ciudad">
            </header>

            <div class="glass-box">
                <div class="box-content">
                    <h3>San Francisco, CA</h3>
                    <span>72º<small>ºF</small></span>
                    <h3>Nublado</h3>
                    <small>2% Precipitación</small>
                    
                </div>
                <!--De momento place holder-->
                <img src="./images/icon.png" class="image-content">
            </div>
        </main>
    </body>
</html>
