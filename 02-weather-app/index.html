<!DOCTYPE html>

<html lang="es">
    <head>
        <meta charset="UTF-8"/> 
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Weather-App</title>
        <meta
        name="description"
        content="Encuentra la temperatura de la ciudad a tu elección"
        />
        <meta name="robots" content="index,follow">

        <meta name="theme-color" content="#ffffff">

        <link rel="icon" type="image/jpg" href="./images/icon.png"> <!--Pendiente de hacer-->
        <link rel="stylesheet" href="./style.css">
        <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
        <script defer type="module" src="./script.js"></script>
    </head>

    <body>
        <header>
            <h1>Aero-Weather</h1>
            <button>
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--tertiary-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-brightness"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" /><path d="M12 3l0 18" /><path d="M12 9l4.65 -4.65" /><path d="M12 14.3l7.37 -7.37" /><path d="M12 19.6l8.85 -8.85" /></svg>
            </button>
        </header>
        <main>
            <header>
                <form role="search" id="form-busqueda">
                    <div class="input-container">
                        <input name="ciudad" type="text" placeholder="Busca una ciudad">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--tertiary-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-search"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" /><path d="M21 21l-6 -6" /></svg>
                    </div>
                </form>
                
                <div class="box-results">
                    <ul id="search-results"></ul>
                </div>
                
            </header>

            <div class="glass-box">
                <div class="box-content">
                    <h3 id="city-name"></h3>
                    <span id="city-temperature"><small id="temperature-unit"></small></span>
                    <h3 id="city-weathercode"></h3>
                    <small id="city-precipitation"></small>
                    
                </div>
                <div class="icon-container">
                    <weather-icon data-value=""></weather-icon>
                </div>
                
            </div>
            <div class="chart-container">
                <div class="icon-chart-container">
                    <weather-icon data-value="" class="weather-chart-icon"></weather-icon>
                    <weather-icon data-value="" class="weather-chart-icon"></weather-icon>
                    <weather-icon data-value="" class="weather-chart-icon"></weather-icon>
                    <weather-icon data-value="" class="weather-chart-icon"></weather-icon>
                    <weather-icon data-value="" class="weather-chart-icon"></weather-icon>
                    <weather-icon data-value="" class="weather-chart-icon"></weather-icon>
                    <weather-icon data-value="" class="weather-chart-icon"></weather-icon>
                </div>
                <canvas id="weather-chart"></canvas>
            </div>
        </main>
    </body>
</html>
