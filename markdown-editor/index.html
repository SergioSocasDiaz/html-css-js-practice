<!DOCTYPE html>

<html lang="es">
    <head>
        <meta charset="UTF-8"/> 
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Markdown-Editor</title>
        <meta
        name="description"
        content="Make your own markdown files via web"
        />
        <meta name="robots" content="index,follow">

        <meta name="theme-color" content="#ffffff">

        <link rel="icon" type="image/jpg" href="./images/icon.png">
        <link rel="stylesheet" href="./style.css">
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.4.11/purify.min.js"></script>   
        <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
        <script defer type="module" src="./script.js"></script>
    </head>

    <body>
        <header>
            <div class="title-container">
                <h3>Markdown-Editor |</h3>
                <input id="file-name" placeholder="Nombre de archivo">
            </div>
            
            <div class="button-container">
                <button id="bold-button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8582FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-bold"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M7 5h6a3.5 3.5 0 0 1 0 7h-6l0 -7" /><path d="M13 12h1a3.5 3.5 0 0 1 0 7h-7v-7" /></svg>
                </button>
                <button id="italic-button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8582FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-italic"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M11 5l6 0" /><path d="M7 19l6 0" /><path d="M14 5l-4 14" /></svg>
                </button>
                <button id="theme-button">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8582FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-brightness"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" /><path d="M12 3l0 18" /><path d="M12 9l4.65 -4.65" /><path d="M12 14.3l7.37 -7.37" /><path d="M12 19.6l8.85 -8.85" /></svg>
                </button>
                
            </div>
            
        </header>

        <main>
            <div id="editor-field" class="editor-div">
            <textarea id="editor-text" placeholder="Escribe aquí tu Markdown"></textarea>
            </div>
            <div id="visual-field" class="editor-div"></div>
            </main>

            <footer>
            <button class="file" id="delete-file">Delete</button>
            <a id="download-button">Download</a>
            <button class= "file" id="save-file">Save</button>
            
            </footer>
        
    </body>
</html>
